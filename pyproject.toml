[project]
name = "dms-workspace"
version = "0.3.0.dev0"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7", "mypy>=1.13", "lupa>=2.0"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
exclude = ['legacy/', 'packages/[^/]+/tests/conftest[.]py$']

[tool.pytest.ini_options]
testpaths = ["packages", "lua", "tests", "evals", "arma/tools", "tools/tests"]
addopts = "-q --strict-markers"

[[tool.mypy.overrides]]
module = ["lupa", "lupa.*", "dcs", "dcs.*", "yaml", "imageio_ffmpeg", "elevenlabs", "elevenlabs.*"]
ignore_missing_imports = true
