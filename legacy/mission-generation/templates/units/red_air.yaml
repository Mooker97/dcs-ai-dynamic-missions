# ============================================================================
# MIXED THREAT PACKAGES
# ============================================================================

Mixed_Strike_Package:
  name: "Strike Package {id}"
  country: "Russia"
  description: "Combined strike package with escorts"
  groups:
    - template: "SU30_Strike_2ship"
      offset: [0, 0]
      role: "striker"
    - template: "MIG29_CAP_2ship"
      offset: [-2000, -2000]
      role: "escort"

High_Value_CAP:
  name: "CAP {id}"
  country: "Russia"
  description: "High-threat CAP with multiple elements"
  groups:
    - template: "SU27_CAP_2ship"
      offset: [0, 0]
      role: "primary"
    - template: "MIG29_CAP_2ship"
      offset: [-5000, 5000]
      role: "support"

# ============================================================================
# THREAT LEVEL RECOMMENDATIONS
# ============================================================================
#
# Light Threat:
#   - MIG21_CAP_2ship
#   - L39_Light_2ship
#   - MI24_Attack_2ship
#
# Moderate Threat:
#   - MIG29_CAP_2ship
#   - SU25_CAS_2ship
#   - KA50_Attack_2ship
#
# Heavy Threat:
#   - SU27_CAP_2ship (or 4-ship)
#   - MIG29_CAP_4ship
#   - SU30_Strike_2ship
#   - Mixed_Strike_Package
#
# Overwhelming Threat:
#   - Multiple SU27/MIG29 flights
#   - High_Value_CAP
#   - Coordinated strike packages
#
# ============================================================================
# TACTICAL NOTES
# ============================================================================
#
# MiG-29S: Short-range CAP, good low-altitude performance
# Su-27: Long-range air superiority, excellent BVR capability
# Su-30: Multirole, both A2A and A2G capable
# Su-25T: Dedicated CAS, slow but heavily armed
# MiG-21bis: Budget option, short range, limited missiles
# L-39: Training/light attack, minimal threat
# Mi-24/Ka-50: Helicopter threats for low-altitude operations
