[project]
name = "dms-gen"
version = "0.3.0.dev0"
description = "DMS generator: spec -> plan -> .miz"
requires-python = ">=3.11"
dependencies = ["dms-core", "pydcs==1.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dms_gen"]

[tool.uv.sources]
dms-core = { workspace = true }
