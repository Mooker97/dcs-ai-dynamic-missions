[project]
name = "dms-arma"
version = "0.3.0.dev0"
description = "DMS Arma 3 backend: mission spec -> fn_config.sqf (SQF emitter, parser, KB checks)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dms_arma"]

[project.scripts]
dms-arma = "dms_arma.cli:main"
