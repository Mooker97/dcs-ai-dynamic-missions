# DMS catalog: unit types
# -----------------------------------------------------------------------------
# GENERATED from legacy/lua-library/spawners/unit-templates.lua (unit dictionary),
# legacy/mission-generation/templates/units/*.yaml, plus hand-picked additions.
# Every `id` was cross-checked against pydcs 1.0.0 (dcs.vehicles.vehicle_map,
# dcs.planes.plane_map, dcs.helicopters.helicopter_map, dcs.ships.ship_map).
# tests: packages/dms-core/tests/test_catalog.py asserts every pydcs_id resolves.
#
# Fields
#   id           DCS type string (what goes in a mission's `type =`). Unique.
#   name         Human-readable name.
#   category     ground | plane | helicopter | ship
#   role         primary role, e.g. sam_long, sam_medium, sam_short, sam_radar (SAM
#                component), aaa, manpads, mbt, ifv, apc, recon, technical, emplacement,
#                infantry, jtac, transport, logistics, artillery, mlrs, ballistic_missile,
#                fighter, multirole, strike, attack, bomber, awacs, tanker, uav, trainer,
#                attack_helo, scout_helo, utility_helo, transport_helo, carrier, cruiser,
#                destroyer, frigate, corvette, patrol, cargo
#   threat       none | low | medium | high   (threat to aircraft/helicopters)
#   eras         plausible service eras: early_cold_war | late_cold_war | modern (see eras.yaml)
#   coalitions   typical side(s): red | blue | neutral (a hint, not a rule)
#   countries    typical DCS country.id keys (RUSSIA, USA, INSURGENTS, CJTF_RED, ...)
#   tags         secondary roles/traits usable in queries (sead, cap, cas, anti_helo, ir, convoy, hvt, player, mod...)
#   pydcs_id     pydcs unit id (== DCS type string)
#   pydcs_class  pydcs Python class path relative to `dcs.` (e.g. vehicles.AirDefence.Tor_9A331)
#
# Legacy type strings that were INVALID and were corrected:
#   "F/A-18C_hornet" -> "FA-18C_hornet"   ("F/A-18C" is the old Lock-On model)
#   "M163 Vulcan"    -> "Vulcan"
#   "S-125 ln"       -> "5p73 s-125 ln"
#   "S-125 p-19 sr"  -> "p-19 s-125 sr"
#   S-300PMU (SA-20) components ("S-300PMU 64N6E big bird sr", "... 30N6E tr", "... 54K6E cp",
#   "... 5P85CE ln", "... 5P85DE ln") do not exist in DCS core / pydcs 1.0 -> dropped.
# Note: CHAP_* types belong to the free "Cold War / Currenthill"-style asset packs bundled
#       with recent DCS; they are tagged `mod` in case a server lacks them.

