# ============================================================================
# TEMPLATE NOTES
# ============================================================================
#
# Variable Substitutions:
#   {id} - Auto-incremented counter (e.g., "Viper 1", "Viper 2")
#   {airbase: "auto"} - Automatically select appropriate friendly airbase
#   {offset: [x, y]} - Position relative to mission center or specified anchor
#
# Loadout Names:
#   These are placeholders - actual loadout modification requires
#   using the loadout modification functions with specific pylon configs
#
# Position Offsets:
#   - Formation positions use relative offsets in meters
#   - Standard spacing: 50m between wingmen
#   - Waypoint offsets are relative to mission anchor point
#
# Skills:
#   - Player: Human pilot
#   - Client: Available for multiplayer
#   - Excellent/High/Good/Average/Random
#
# Frequencies:
#   - 251.0 - AWACS
#   - 251.0-255.0 - Flight frequencies
#   - 256.0+ - Support assets (tankers, etc.)
