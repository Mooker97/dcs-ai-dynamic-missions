[project]
name = "dms-gen"
version = "0.3.0.dev0"
description = "DMS generator: spec -> plan -> .miz"
requires-python = ">=3.11"
dependencies = [
    "dms-core",
    "pillow>=11.0",
    "pydcs==1.0.0",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dms_gen"]

[tool.uv.sources]
dms-core = { workspace = true }
