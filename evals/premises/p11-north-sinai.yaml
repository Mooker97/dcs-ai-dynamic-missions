  era: [2014, 2017]
  mode: adapted
  player_coalition: blue
  airframes: [F-16C_50]
  airframe_role: multirole
  missions: [3, 5]
  mission_types: [CAS, STRIKE]
  story_elements:
  - id: el_arish
    description: El Arish area
    any_of: [el arish]
  - id: bad_intel
    description: Doubtful intelligence
    any_of: [doubt, unreliable, questionable, bad intel]
  - id: liaison
    description: The liaison officer
    any_of: [liaison]
notes: Adapted, non-US blue coalition.
