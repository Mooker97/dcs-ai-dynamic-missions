# Eval premise p31-viper-detachment. Schema: evals/run.py Premise. Give `prompt` to the story-writer skill verbatim,
# then score: uv run python evals/run.py --score campaigns/<slug> --premise p31-viper-detachment
id: p31-viper-detachment
title: Viper Detachment
genre: fictional
prompt: A small USAF F-16 detachment flies out of Incirlik in support of a partner ground force holding the
  border plain north of Aleppo. The enemy is not an army but a well-funded insurgency that looted a collapsed
  garrison's stocks at Kuweires and now fields technicals, mortar teams, a few old tanks and a handful of
  captured radar SAMs. Four sorties, four of the Viper's core jobs - take down the SAM belt, flatten a weapons
  depot with laser-guided bombs, put bombs on fortified positions for a JTAC with troops in contact, and hunt
  the last mobile SAM as it is moved under escort. 2016, grounded and procedural, ROE that matter, invented
  factions, no real people or operations.
expect:
  theater: Syria
  era: [2015, 2017]
  mode: fictional
  player_coalition: blue
  airframes: [F-16C_50]
  airframe_role: multirole
  missions: [4, 4]
  mission_types: [SEAD, STRIKE, CAS]
  story_elements:
  - id: incirlik
    description: Flies out of Incirlik
    any_of: [incirlik]
  - id: kuweires
    description: Looted stocks at Kuweires
    any_of: [kuweires]
  - id: partner_force
    description: A partner ground force on the border plain
    any_of: [partner]
  - id: captured_sams
    description: Captured radar SAMs
    any_of: [captured, looted]
  - id: jtac
    description: A JTAC with troops in contact
    any_of: [jtac, troops in contact]
  - id: roe
    description: ROE that matter
    any_of: [rules of engagement, roe, positive id, pid, collateral]
  - id: lgb
    description: Laser-guided bombs
    any_of: [gbu-12, gbu-10, gbu-24, laser-guided, lgb]
notes: >-
  Retro-scored. campaigns/viper-detachment was generated by the skills from the user's own request
  (premise.md pitch + interview) before this premise existed; the prompt here is that pitch and the
  expect block only encodes what the user asked for (Syria, 2016, F-16C_50, 4 missions, SEAD / LGB
  strike / CAS, invented factions). The first LLM-generated campaign scored by the suite.
