[project]
name = "dms-mcp"
version = "0.3.0.dev0"
description = "DMS MCP server (FastMCP, stdio): coarse tools over the generator library"
requires-python = ">=3.11"
dependencies = ["dms-core", "dms-gen", "dms-cli", "mcp>=1.9,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dms_mcp"]

[tool.uv.sources]
dms-core = { workspace = true }
dms-gen = { workspace = true }
dms-cli = { workspace = true }

[project.scripts]
dms-mcp = "dms_mcp.server:main"
