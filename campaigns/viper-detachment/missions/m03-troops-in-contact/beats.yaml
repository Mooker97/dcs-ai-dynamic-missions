# m03 Troops in Contact — beats. Schema: schemas/beats.schema.json (BeatSheet). Compiled into DMS_CONFIG.beats.
# group_prefix values are spec ids (threat / pool / support); planned and spawned group names start
# with them (pool spawns are DMS_<pool>_n; the runtime strips DMS_ when matching).
#
# Guaranteed spine (guaranteed: true; reachable from BOTH player flights, nothing hangs on takeoff):
#   mission_start -> magic_handoff (CP TUSK) -> jtac_checkin -> nine_line_1 -> talk_on_1
#   -> nine_line_2 (danger close; via the Mill kill OR the 8-min retask) -> jtac_checkout -> rook_rtb
# The fight ends one of two ways, and exactly one always happens (marked "# GUARANTEED (one of)"):
#   assault_broken_call (3 fortified positions, or 2 + the armor) or nbb_withdraw_* (hold-time limit).
# Both set fight_over, which drives the check-out. Hold time = 20 + 5 * partner_morale minutes after
# Jackal's check-in, in three tiers keyed on the campaign quality (<= -1: 15, 0: 20, >= 1: 25 min).
# Landing/tower beats are optional (the air-start variant may never land). Built as two variants
# (-ramp.miz, -air.miz); no beat filters on a player group name, so every beat resolves in both.
mission_id: m03-troops-in-contact
beats:
  # ---- Guaranteed spine -----------------------------------------------------------------------
  # GUARANTEED
  - id: mission_start
    when: {event: timer, after_sec: 20}
    priority: 90
    once: true
    guaranteed: true
    speaker: ops_lindqvist
    lines: [ops_scramble_v1, ops_scramble_v2, ops_scramble_v3, ops_scramble_v4]
    text: "Python, Rook Ops. Troops in contact north of Tell Rifaat. Jackal Two-Three requests CAS. Push CP Tusk, check in with Magic."
    mark: {type: text, at: "zone:ip_tusk", text: "CP TUSK"}
    effects: {set_flag: started}

  # GUARANTEED
  - id: magic_handoff
    when: {event: zone.entered, zone: ip_tusk, players_only: true}
    requires: {flags_not: [checked_in]}
    priority: 88
    once: true
    guaranteed: true
    speaker: awacs_magic
    lines: [magic_handoff_v1, magic_handoff_v2, magic_handoff_v3, magic_handoff_v4]
    text: "Python, Magic. Radar contact, Tusk. Picture clean. Contact Jackal Two-Three, his push."
    mark: {type: circle, at: "zone:village_lantern", radius_m: 500, text: "LANTERN - FRIENDLIES - NO FIRE"}
    effects: {set_flag: checked_in}

  # GUARANTEED
  - id: jtac_checkin
    when: {event: flag, flag: checked_in}
    delay_sec: 12
    priority: 87
    once: true
    guaranteed: true
    speaker: jtac_ortiz
    lines: [jtac_checkin_v1, jtac_checkin_v2, jtac_checkin_v3, jtac_checkin_v4]
    text: "Python, Jackal Two-Three. Troops in contact. DShK and RPG fire from the compounds south of the village. Friendlies in the village only."
    effects: {set_flag: on_station}

  # GUARANTEED
  - id: nine_line_1
    when: {event: beat.fired, beat: jtac_checkin}
    delay_sec: 25
    priority: 86
    once: true
    guaranteed: true
    speaker: jtac_ortiz
    lines: [nine_line_1_v1, nine_line_1_v2, nine_line_1_v3, nine_line_1_v4]
    text: "Python, Jackal. Type two, bomb on target. Target: two DShK technicals dug in inside the Mill compound, 2.2 km south of the village. Mark: talk-on. Friendlies north 2,200 m. Egress west."
    mark: {type: circle, at: "zone:mill_compound", radius_m: 200, text: "JACKAL TGT 1 - THE MILL"}
    effects: {set_flag: nine_line_1}

  # GUARANTEED
  - id: talk_on_1
    when: {event: beat.fired, beat: nine_line_1}
    delay_sec: 20
    priority: 85
    once: true
    guaranteed: true
    speaker: jtac_ortiz
    lines: [talk_on_1_v1, talk_on_1_v2, talk_on_1_v3, talk_on_1_v4]
    text: "From the village, follow the main road south two kilometres to a tall grain silo. Walled compound west of the silo. Two trucks in the north-east corner."
    effects: {set_flag: talk_on_1_done}   # also wakes encounter assault_push (trigger: beat talk_on_1)

  # GUARANTEED
  - id: nine_line_2
    when: {event: flag, flag: next_target}
    delay_sec: 30
    priority: 86
    once: true
    guaranteed: true
    speaker: jtac_ortiz
    lines: [nine_line_2_v1, nine_line_2_v2, nine_line_2_v3, nine_line_2_v4]
    text: "Python, Jackal. Type two, bomb on target. Target: RPG and machine-gun team, the Orchard, 500 m south-south-east of the village. Friendlies north 500 m. Danger close. I need your initials."
    mark: {type: circle, at: "zone:orchard_compound", radius_m: 150, text: "JACKAL TGT 2 - ORCHARD - DANGER CLOSE"}
    effects: {set_flag: danger_close}

  # GUARANTEED
  - id: jtac_checkout
    when: {event: flag, flag: fight_over}
    delay_sec: 30
    priority: 84
    once: true
    guaranteed: true
    speaker: jtac_ortiz
    lines: [jtac_checkout_v1, jtac_checkout_v2, jtac_checkout_v3, jtac_checkout_v4]
    text: "Python, Jackal Two-Three. Copy BDA. Nothing further. Cleared off station, contact Magic."
    effects: {set_flag: checked_out}

  # GUARANTEED
  - id: rook_rtb
    when: {event: beat.fired, beat: jtac_checkout}
    delay_sec: 15
    priority: 84
    once: true
    guaranteed: true
    speaker: ops_lindqvist
    lines: [ops_rtb_v1, ops_rtb_v2, ops_rtb_v3, ops_rtb_v4]
    text: "Python, Rook Ops. Copy off station. RTB. Debrief at the ops desk."
    effects: {set_flag: rtb}

  # ---- How the fight ends (exactly one of these always fires) ----------------------------------
  # GUARANTEED (one of): the assault breaks
  - id: assault_broken_call
    when: {event: flag, flag: assault_broken}
    requires: {flags_not: [nbb_withdrew]}
    delay_sec: 10
    priority: 89
    once: true
    speaker: jtac_ortiz
    lines: [assault_broken_v1, assault_broken_v2, assault_broken_v3, assault_broken_v4]
    text: "Python, Jackal. They're pulling back south. Assault is broken. Good effects."
    effects: {set_flag: fight_over, outcome: {position_held: true}}

  - id: assault_break_forts           # silent: three fortified positions destroyed
    when: {event: flag, flag: forts_3}
    requires: {flags_not: [assault_broken, nbb_withdrew]}
    priority: 60
    once: true
    effects: {set_flag: assault_broken}

  - id: assault_break_armor           # silent: armor destroyed after two positions
    when: {event: flag, flag: armor_dead}
    requires: {flags: [forts_2], flags_not: [assault_broken, nbb_withdrew]}
    priority: 60
    once: true
    effects: {set_flag: assault_broken}

  - id: assault_break_forts_after_armor   # silent: second position after the armor
    when: {event: flag, flag: forts_2}
    requires: {flags: [armor_dead], flags_not: [assault_broken, nbb_withdrew]}
    priority: 60
    once: true
    effects: {set_flag: assault_broken}

  - id: nbb_status_10
    when: {event: beat.fired, beat: jtac_checkin}
    delay_sec: 600
    requires: {flags_not: [assault_broken, nbb_withdrew]}
    priority: 55
    once: true
    speaker: jtac_ortiz
    lines: [nbb_status_v1, nbb_status_v2, nbb_status_v3]
    text: "Python, Jackal. Lantern is holding. Taking casualties. Keep it coming."

  # Telegraph 60 s before the withdrawal, per partner_morale tier.
  - id: nbb_wavering_low
    when: {event: beat.fired, beat: jtac_checkin}
    delay_sec: 840
    requires: {flags_not: [assault_broken, nbb_withdrew], qualities: [{quality: partner_morale, op: "<=", value: -1}]}
    priority: 80
    once: true
    speaker: jtac_ortiz
    lines: [nbb_wavering_v1, nbb_wavering_v2, nbb_wavering_v3]
    text: "Python, Jackal. Lantern is almost out of ammunition. One minute, then they pull back."

  - id: nbb_wavering_mid
    when: {event: beat.fired, beat: jtac_checkin}
    delay_sec: 1140
    requires: {flags_not: [assault_broken, nbb_withdrew], qualities: [{quality: partner_morale, op: "==", value: 0}]}
    priority: 80
    once: true
    speaker: jtac_ortiz
    lines: [nbb_wavering_v1, nbb_wavering_v2, nbb_wavering_v3]
    text: "Python, Jackal. Lantern is almost out of ammunition. One minute, then they pull back."

  - id: nbb_wavering_high
    when: {event: beat.fired, beat: jtac_checkin}
    delay_sec: 1440
    requires: {flags_not: [assault_broken, nbb_withdrew], qualities: [{quality: partner_morale, op: ">=", value: 1}]}
    priority: 80
    once: true
    speaker: jtac_ortiz
    lines: [nbb_wavering_v1, nbb_wavering_v2, nbb_wavering_v3]
    text: "Python, Jackal. Lantern is almost out of ammunition. One minute, then they pull back."

  # GUARANTEED (one of): the NBB falls back at the hold-time limit
  - id: nbb_withdraw_low
    when: {event: beat.fired, beat: jtac_checkin}
    delay_sec: 900
    requires: {flags_not: [assault_broken, nbb_withdrew], qualities: [{quality: partner_morale, op: "<=", value: -1}]}
    priority: 89
    once: true
    speaker: jtac_ortiz
    lines: [nbb_withdraw_v1, nbb_withdraw_v2, nbb_withdraw_v3, nbb_withdraw_v4]
    text: "Python, Jackal. Lantern is falling back north. Check fire on the village. We're moving."
    effects: {set_flag: [nbb_withdrew, fight_over], outcome: {position_held: false}}

  - id: nbb_withdraw_mid
    when: {event: beat.fired, beat: jtac_checkin}
    delay_sec: 1200
    requires: {flags_not: [assault_broken, nbb_withdrew], qualities: [{quality: partner_morale, op: "==", value: 0}]}
    priority: 89
    once: true
    speaker: jtac_ortiz
    lines: [nbb_withdraw_v1, nbb_withdraw_v2, nbb_withdraw_v3, nbb_withdraw_v4]
    text: "Python, Jackal. Lantern is falling back north. Check fire on the village. We're moving."
    effects: {set_flag: [nbb_withdrew, fight_over], outcome: {position_held: false}}

  - id: nbb_withdraw_high
    when: {event: beat.fired, beat: jtac_checkin}
    delay_sec: 1500
    requires: {flags_not: [assault_broken, nbb_withdrew], qualities: [{quality: partner_morale, op: ">=", value: 1}]}
    priority: 89
    once: true
    speaker: jtac_ortiz
    lines: [nbb_withdraw_v1, nbb_withdraw_v2, nbb_withdraw_v3, nbb_withdraw_v4]
    text: "Python, Jackal. Lantern is falling back north. Check fire on the village. We're moving."
    effects: {set_flag: [nbb_withdrew, fight_over], outcome: {position_held: false}}

  # ---- Optional: departure (ramp variant) and air start (air variant) --------------------------
  # No beat names a player group: the variants are told apart by where the lead spawns. The ramp
  # lead spawns inside the incirlik zone, so the first zone poll emits zone.entered and sets
  # ramp_start; the air lead spawns 20 NM short of TUSK and never does before check-in.
  - id: ramp_start_detect          # silent: ramp variant only
    when: {event: zone.entered, zone: incirlik, players_only: true}
    requires: {flags_not: [checked_in, ramp_start]}
    priority: 50
    once: true
    effects: {set_flag: ramp_start}

  - id: ground_taxi
    when: {event: flag, flag: ramp_start}
    delay_sec: 60
    requires: {flags_not: [checked_in]}
    priority: 40
    once: true
    speaker: tower_incirlik
    lines: [ground_taxi_v1, ground_taxi_v2, ground_taxi_v3]
    text: "Python One, Incirlik Ground. Scramble copied. Runway two-three, wind two-five-zero at one-five. Taxi when ready."

  - id: tower_departure            # only a ramp start ever takes off before check-in
    when: {event: unit.takeoff, players_only: true}
    requires: {flags_not: [checked_in]}
    priority: 60
    once: true
    speaker: tower_incirlik
    lines: [tower_departure_v1, tower_departure_v2, tower_departure_v3]
    text: "Python One, Incirlik Tower. Airborne. Contact Magic. Good day."

  - id: air_start_greeting         # air variant only: no ramp_start 40 s after spawn
    when: {event: player.spawned, players_only: true}
    delay_sec: 40
    requires: {flags_not: [checked_in, ramp_start]}
    priority: 45
    once: true
    speaker: awacs_magic
    lines: [magic_airstart_v1, magic_airstart_v2, magic_airstart_v3]
    text: "Python, Magic. Radar contact, twenty miles west of Tusk. Proceed Tusk, check in on arrival."

  - id: magic_handoff_late           # fallback if a flight skips the CP and goes straight to the fight
    when: {event: zone.entered, zone: fight_box, players_only: true}
    requires: {flags_not: [checked_in]}
    priority: 88
    once: true
    speaker: awacs_magic
    lines: [magic_late_v1, magic_late_v2, magic_late_v3]
    text: "Python, Magic. Radar contact north of Tell Rifaat, you're past Tusk. Contact Jackal Two-Three now."
    mark: {type: circle, at: "zone:village_lantern", radius_m: 500, text: "LANTERN - FRIENDLIES - NO FIRE"}
    effects: {set_flag: checked_in}

  # ---- Optional: the first target --------------------------------------------------------------
  - id: pike_tally_1
    when: {event: beat.fired, beat: talk_on_1}
    delay_sec: 30
    requires: {chance: 70, flags_not: [mill_destroyed]}
    priority: 45
    once: true
    speaker: wingman_pike
    lines: [pike_tally_1_v1, pike_tally_1_v2, pike_tally_1_v3]
    text: "Two, tally silo. Compound west of it."

  - id: describe_first             # dormant at collateral 0; ROE tightens on replays
    when: {event: beat.fired, beat: talk_on_1}
    delay_sec: 40
    requires: {flags_not: [mill_destroyed], qualities: [{quality: collateral, op: ">=", value: 1}]}
    priority: 82
    once: true
    speaker: jtac_ortiz
    lines: [describe_first_v1, describe_first_v2, describe_first_v3]
    text: "Python, Jackal. Before I clear you, describe what's in your pod. Everything in the compound."

  - id: cleared_hot_1
    when: {event: beat.fired, beat: talk_on_1}
    delay_sec: 60
    requires: {flags_not: [mill_destroyed]}
    priority: 80
    once: true
    speaker: jtac_ortiz
    lines: [cleared_hot_1_v1, cleared_hot_1_v2, cleared_hot_1_v3, cleared_hot_1_v4]
    text: "Python, Jackal. Final attack heading zero-niner-zero to one-two-zero. Nothing north of the silo. Cleared hot."

  - id: mill_good_effects
    when: {event: group.dead, group_prefix: fort_mill}
    priority: 75
    once: true
    speaker: jtac_ortiz
    lines: [mill_good_effects_v1, mill_good_effects_v2, mill_good_effects_v3, mill_good_effects_v4]
    text: "Python, Jackal. Good effects. Fire from the Mill has stopped."
    effects: {set_flag: [mill_destroyed, next_target]}

  - id: jtac_retask                # the Mill survives eight minutes: Jackal moves on anyway
    when: {event: beat.fired, beat: talk_on_1}
    delay_sec: 480
    requires: {flags_not: [next_target]}
    priority: 70
    once: true
    speaker: jtac_ortiz
    lines: [jtac_retask_v1, jtac_retask_v2, jtac_retask_v3]
    text: "Python, Jackal. Leave the Mill. Higher priority target. Stand by for nine-line."
    effects: {set_flag: next_target}

  # ---- Optional: danger close ----------------------------------------------------------------
  - id: talk_on_2
    when: {event: beat.fired, beat: nine_line_2}
    delay_sec: 20
    requires: {flags_not: [orchard_destroyed]}
    priority: 80
    once: true
    speaker: jtac_ortiz
    lines: [talk_on_2_v1, talk_on_2_v2, talk_on_2_v3]
    text: "From the Mill, back north up the road. Olive grove east of the road, just short of the village. Single building at the south edge of the grove."

  - id: danger_close_cleared
    when: {event: beat.fired, beat: talk_on_2}
    delay_sec: 35
    requires: {flags_not: [orchard_destroyed]}
    priority: 80
    once: true
    speaker: jtac_ortiz
    lines: [danger_close_cleared_v1, danger_close_cleared_v2, danger_close_cleared_v3]
    text: "Python, Jackal. Copy initials. Final attack heading two-seven-zero, east to west only. GBU-12 only. Cleared hot."

  - id: orchard_good_effects
    when: {event: group.dead, group_prefix: fort_orchard}
    priority: 76
    once: true
    speaker: jtac_ortiz
    lines: [orchard_good_effects_v1, orchard_good_effects_v2, orchard_good_effects_v3]
    text: "Python, Jackal. Good effects. Orchard is quiet. Friendlies are okay."
    effects: {set_flag: orchard_destroyed}

  - id: nine_line_3
    when: {event: beat.fired, beat: orchard_good_effects}
    delay_sec: 45
    requires: {flags_not: [assault_broken, nbb_withdrew]}
    priority: 72
    once: true
    speaker: jtac_ortiz
    lines: [nine_line_3_v1, nine_line_3_v2, nine_line_3_v3]
    text: "Python, Jackal. Type two, bomb on target. Next position, a farm compound south of the Mill. RPG team in the yard. Friendlies north 2,500 m."
    mark: {type: circle, at: "group:fort_pos", radius_m: 250, text: "JACKAL TGT - FARM COMPOUND"}

  # ---- Optional: the armor ---------------------------------------------------------------------
  - id: armor_nine_line
    when: {event: beat.fired, beat: nine_line_2}
    delay_sec: 300
    requires: {flags_not: [armor_dead, assault_broken, nbb_withdrew]}
    priority: 78
    once: true
    speaker: jtac_ortiz
    lines: [armor_nine_line_v1, armor_nine_line_v2, armor_nine_line_v3, armor_nine_line_v4]
    text: "Python, Jackal. Tracks firing on the village from the north edge of Tell Rifaat. Armour between the houses. Mavericks preferred. Watch the Shilka."
    mark: {type: circle, at: "group:armor", radius_m: 400, text: "JACKAL TGT - ARMOR"}

  - id: pike_tracks
    when: {event: beat.fired, beat: armor_nine_line}
    delay_sec: 30
    requires: {chance: 60, flags_not: [armor_dead]}
    priority: 45
    once: true
    speaker: wingman_pike
    lines: [pike_tracks_v1, pike_tracks_v2, pike_tracks_v3]
    text: "Two, contact tracks, north edge of town."

  - id: armor_destroyed
    when: {event: group.dead, group_prefix: armor}
    priority: 74
    once: true
    speaker: jtac_ortiz
    lines: [armor_destroyed_v1, armor_destroyed_v2, armor_destroyed_v3]
    text: "Python, Jackal. Good hits on the armour. Shelling has stopped."
    effects: {set_flag: armor_dead}

  # ---- Optional: the assault waves and the civilians -------------------------------------------
  - id: assault_wave_report
    when: {event: encounter.wave, encounter: assault_push}
    requires: {flags_not: [assault_broken, nbb_withdrew]}
    priority: 65
    once: false
    cooldown_sec: 150
    speaker: jtac_ortiz
    lines: [assault_wave_v1, assault_wave_v2, assault_wave_v3, assault_wave_v4]
    text: "Python, Jackal. More technicals coming north up the road from Tell Rifaat."

  - id: tech_good_effects
    when: {event: unit.dead, group_prefix: assault}
    requires: {chance: 60}
    priority: 42
    once: false
    cooldown_sec: 90
    speaker: jtac_ortiz
    lines: [tech_good_effects_v1, tech_good_effects_v2, tech_good_effects_v3]
    text: "Python, Jackal. Good effects. Technical burning."

  - id: civ_warning
    when: {event: encounter.spawned, encounter: civ_flee}
    priority: 55
    once: true
    speaker: jtac_ortiz
    lines: [civ_warning_v1, civ_warning_v2, civ_warning_v3]
    text: "Python, Jackal. Civilian cars on the road north, coming through the village. Confirm before you shoot anything on that road."

  # ---- Optional: threats -----------------------------------------------------------------------
  - id: sa13_warning               # telegraph for encounter sa13_ambush (30-60 s before it goes hot)
    when: {event: encounter.telegraph, encounter: sa13_ambush}
    priority: 92
    once: true
    speaker: jtac_ortiz
    lines: [sa13_warning_v1, sa13_warning_v2, sa13_warning_v3, sa13_warning_v4]
    text: "Python, Jackal. Missile vehicle, launch rails up, moving north out of Tell Rifaat. SA-13, Gopher."
    mark: {type: circle, at: "zone:sa13_hide", radius_m: 1500, text: "POSS SHORT-RANGE SAM (OBSERVER REPORT)"}
    effects: {set_flag: sa13_warned}

  - id: sam_launch
    when: {event: unit.shot, group_prefix: sam13}
    priority: 94
    once: false
    cooldown_sec: 60
    speaker: wingman_pike
    lines: [pike_sam_launch_v1, pike_sam_launch_v2, pike_sam_launch_v3]
    text: "One, Two. SAM launch, south. Flares."

  - id: manpads_launch
    when: {event: unit.shot, group_prefix: manpads}
    priority: 93
    once: false
    cooldown_sec: 60
    speaker: wingman_pike
    lines: [pike_manpads_v1, pike_manpads_v2, pike_manpads_v3]
    text: "One, Two. Launch, low, behind you. Flares."

  - id: sam_destroyed
    when: {event: group.dead, group_prefix: sam13}
    priority: 60
    once: true
    speaker: wingman_pike
    lines: [pike_sam_dead_v1, pike_sam_dead_v2, pike_sam_dead_v3]
    text: "Two, good hits on the SAM vehicle. It's burning."

  - id: player_hit
    when: {event: unit.hit, players_only: true}
    priority: 85
    once: false
    cooldown_sec: 120
    speaker: wingman_pike
    lines: [pike_say_status_v1, pike_say_status_v2, pike_say_status_v3]
    text: "One, Two. You took a hit. Say status."

  # ---- Optional: consequences ------------------------------------------------------------------
  - id: weapon_release             # silent: opens a 45 s window that attributes friendly deaths to PYTHON
    when: {event: unit.shot, players_only: true}
    priority: 30
    once: false
    effects: {set_flag: weapons_released}

  - id: weapon_release_clear       # silent: closes the window
    when: {event: beat.fired, beat: weapon_release}
    delay_sec: 45
    priority: 30
    once: false
    effects: {clear_flag: weapons_released}

  - id: fratricide
    when: {event: unit.dead, group_prefix: nbb_company}
    requires: {flags: [weapons_released]}
    priority: 98
    once: true
    speaker: jtac_ortiz
    lines: [fratricide_v1, fratricide_v2, fratricide_v3, fratricide_v4]
    text: "Check fire, check fire, check fire. Friendlies hit in the village."
    effects: {set_flag: fratricide, outcome: {fratricide: true}}

  - id: nbb_casualty
    when: {event: unit.dead, group_prefix: nbb_company}
    requires: {flags_not: [weapons_released]}
    priority: 50
    once: false
    cooldown_sec: 180
    speaker: jtac_ortiz
    lines: [nbb_casualty_v1, nbb_casualty_v2, nbb_casualty_v3]
    text: "Python, Jackal. Lantern has a casualty. Fire from the south."

  - id: civilian_hit
    when: {event: unit.dead, group_prefix: civ_traffic}
    priority: 96
    once: false
    cooldown_sec: 60
    speaker: jtac_ortiz
    lines: [civ_check_fire_v1, civ_check_fire_v2, civ_check_fire_v3, civ_check_fire_v4]
    text: "Check fire, check fire. That was a civilian car on the north road."
    effects: {outcome: {civilians_hit: true}}

