# Red Air Force Unit Templates
# Enemy aircraft compositions

# ============================================================================
# MIG-29 FULCRUM FLIGHTS
# ============================================================================

MIG29_CAP_2ship:
  name: "Fulcrum {id}"
  country: "Russia"
  category: "plane"
  description: "2-ship MiG-29S CAP element"
  units:
    - type: "MiG-29S"
      callsign: "Fulcrum {id}-1"
      position: {offset: [0, 0]}
      loadout: "CAP_Standard"
      fuel: 0.9
      skill: "High"
    - type: "MiG-29S"
      callsign: "Fulcrum {id}-2"
      position: {offset: [50, -50]}
      loadout: "CAP_Standard"
      fuel: 0.9
      skill: "Good"
  waypoints:
    - action: "From Runway"
      position: {airbase: "auto"}
      alt: 0
      speed: 150
    - action: "Turning Point"
      position: {offset: [50000, 0]}
      alt: 8000
      speed: 260
    - action: "Orbit"
      position: {offset: [80000, 20000]}
      alt: 8000
      speed: 260
  frequency: 124.0
  modulation: 0

