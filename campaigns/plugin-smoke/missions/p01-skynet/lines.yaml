# m01 Broken Umbrella — voice lines. Schema: schemas/voice-lines.schema.json (VoiceLineSet).
# One entry per variant (<line>_vN); beats pick one at random without immediate repeats.
# Subtitles only for now (no ElevenLabs render). Style: callsign first, brevity-correct, no cheering.
# Pike is tense on his first sortie: quick, clipped, by the book. Lindqvist never says "good job".
# Run-dependent numbers (BRAA, headings, counts) are avoided; positions are given by landmark.
mission_id: p01-skynet
model: eleven_v3
lines:
  # --- Rook Ops: radio check at spawn (mission_start) --------------------------------------------
  - id: ops_radio_check_v1
    speaker: ops_lindqvist
    beat: mission_start
    delivery: "Ops desk, unhurried, reading from the brief."
    text: "Python, Rook Ops, radio check. Brief is unchanged. Check in with Magic at ARROW."
  - id: ops_radio_check_v2
    speaker: ops_lindqvist
    beat: mission_start
    text: "Python, Rook Ops, loud and clear. No change to the threat picture. Magic at ARROW."
  - id: ops_radio_check_v3
    speaker: ops_lindqvist
    beat: mission_start
    text: "Python, Rook Ops. Weather is as briefed, threat is as briefed. Window opens on your push from ARROW."
  # BENCHED (rendered audio kept in voice/; lint line_too_long/peak_chatter). Re-enable by
  # uncommenting and adding the id back to its beat.
  # - id: ops_radio_check_v4
  #  speaker: ops_lindqvist
  #  beat: mission_start
  #  text: "Python, Rook Ops, radio check. Cyclops Two is airborne and waiting on you. Magic at ARROW."

  # --- Incirlik Ground: taxi (ground_taxi, ramp start only) ------------------------------------
  - id: ground_taxi_v1
    speaker: tower_incirlik
    beat: ground_taxi
    delivery: "Standard phraseology, flat, a little fast."
    text: "Python One-One, Incirlik Ground, taxi runway zero-five, hold short."
  - id: ground_taxi_v2
    speaker: tower_incirlik
    beat: ground_taxi
    text: "Python One-One, Ground, runway zero-five, taxi via parallel, hold short."
  - id: ground_taxi_v3
    speaker: tower_incirlik
    beat: ground_taxi
    text: "Python One-One, Incirlik Ground, wind calm, taxi zero-five, contact Tower holding short."

  # --- Incirlik Tower: departure (tower_departure, ramp start only) -----------------------------
  - id: tower_departure_v1
    speaker: tower_incirlik
    beat: tower_departure
    delivery: "Flat, routine."
    text: "Python One-One, Incirlik Tower, airborne. Contact departure."
  - id: tower_departure_v2
    speaker: tower_incirlik
    beat: tower_departure
    text: "Python One-One, Tower, no traffic. Frequency change approved."
  - id: tower_departure_v3
    speaker: tower_incirlik
    beat: tower_departure
    text: "Python One-One, Incirlik Tower. Climb as filed, contact departure. Good day."
  - id: tower_departure_v4
    speaker: tower_incirlik
    beat: tower_departure
    text: "Python One-One, Tower, airborne at the hour. Switch departure."

  # --- Magic: check-in at ARROW (magic_checkin) ----------------------------------------------
  - id: magic_checkin_v1
    speaker: awacs_magic
    beat: magic_checkin
    delivery: "Cool, exact, unhurried. Slightly formal English."
    text: "Python, Magic, radar contact at ARROW. Picture clean. Push Rook Ops."
  # BENCHED (rendered audio kept in voice/; lint line_too_long/peak_chatter). Re-enable by
  # uncommenting and adding the id back to its beat.
  # - id: magic_checkin_v2
  #  speaker: awacs_magic
  #  beat: magic_checkin
  #  text: "Python, Magic, contact. No air south of the border. Rook Ops has your push."
  - id: magic_checkin_v3
    speaker: awacs_magic
    beat: magic_checkin
    text: "Python, Magic, radar contact, ARROW. Picture clean. Cyclops Two is with me."
  - id: magic_checkin_v4
    speaker: awacs_magic
    beat: magic_checkin
    text: "Python, Magic, identified. Clean, no factor traffic. Contact Rook Ops for push."

  # --- Rook Ops: window open (window_open) -------------------------------------------------
  - id: ops_window_open_v1
    speaker: ops_lindqvist
    beat: window_open
    delivery: "Deliberate. This is the call the brief was built around."
    text: "Python, Rook Ops. Window is open, push. Cyclops Two is inbound to Al Bab."
  - id: ops_window_open_v2
    speaker: ops_lindqvist
    beat: window_open
    text: "Python, Rook Ops, push. Ten minutes from now. Cyclops is on its way in."
  - id: ops_window_open_v3
    speaker: ops_lindqvist
    beat: window_open
    text: "Python, Rook Ops. Push, push. Cyclops Two is coming in behind you. Keep them quiet."
  - id: ops_window_open_v4
    speaker: ops_lindqvist
    beat: window_open
    text: "Python, Rook Ops. Window open. Cyclops Two inbound, ten minutes on station."

  # --- Pike: fence in (fence_in) -------------------------------------------------------------
  - id: pike_fence_in_v1
    speaker: wingman_pike
    beat: fence_in
    delivery: "Quick, tight, first combat sortie. Breath between phrases."
    text: "Python, Two, fenced in. Naked."
  - id: pike_fence_in_v2
    speaker: wingman_pike
    beat: fence_in
    text: "Two's fenced in. Pod's up. Nothing on the scope."
  - id: pike_fence_in_v3
    speaker: wingman_pike
    beat: fence_in
    text: "Python, Two, fenced in, master arm hot, naked."
  - id: pike_fence_in_v4
    speaker: wingman_pike
    beat: fence_in
    text: "Two, fence in. Naked. Visual."

  # --- Rook Ops: SA-6 ELINT telegraph (sa6_emitting) ------------------------------------------
  - id: ops_sa6_elint_v1
    speaker: ops_lindqvist
    beat: sa6_emitting
    delivery: "Shorter sentences now. Still level."
    text: "Python, Rook Ops. ELINT has a Straight Flush coming up, south-east of Al Bab."
  # BENCHED (rendered audio kept in voice/; lint line_too_long/peak_chatter). Re-enable by
  # uncommenting and adding the id back to its beat.
  # - id: ops_sa6_elint_v2
  #  speaker: ops_lindqvist
  #  beat: sa6_emitting
  #  text: "Python, Rook Ops. SA-6 search radar active. South-east of the town. Expect it to go quiet fast."
  - id: ops_sa6_elint_v3
    speaker: ops_lindqvist
    beat: sa6_emitting
    text: "Python, Rook Ops. The SA-6 is waking up. One of the briefed sites. HTS should see it."
  - id: ops_sa6_elint_v4
    speaker: ops_lindqvist
    beat: sa6_emitting
    text: "Python, Rook Ops. Straight Flush, south-east of Al Bab, intermittent. He's looking."

  # --- Pike: Magnum on the SA-6 (sa6_magnum) ------------------------------------------------
  - id: pike_magnum_v1
    speaker: wingman_pike
    beat: sa6_magnum
    delivery: "Clipped, a little fast. First live HARM."
    text: "Two, Magnum, SA-6."
  - id: pike_magnum_v2
    speaker: wingman_pike
    beat: sa6_magnum
    text: "Python, Two, Magnum. Straight Flush."
  - id: pike_magnum_v3
    speaker: wingman_pike
    beat: sa6_magnum
    text: "Two, Magnum. SA-6, south-east."
  - id: pike_magnum_v4
    speaker: wingman_pike
    beat: sa6_magnum
    text: "Two, Magnum, Magnum. Six is up."

  # --- Magic: Cyclops defending (cyclops_defending) -----------------------------------------
  - id: magic_cyclops_defending_v1
    speaker: awacs_magic
    beat: cyclops_defending
    delivery: "Same pace as always. The words carry the urgency, not the voice."
    text: "Python, Magic. Cyclops Two defending. SAM launch south-east of Al Bab."
  - id: magic_cyclops_defending_v2
    speaker: awacs_magic
    beat: cyclops_defending
    text: "Python, Magic. Cyclops reports launch. Defending."
  - id: magic_cyclops_defending_v3
    speaker: awacs_magic
    beat: cyclops_defending
    text: "Python, Magic. Cyclops Two is engaged by the SA-6. Defending north."
  - id: magic_cyclops_defending_v4
    speaker: awacs_magic
    beat: cyclops_defending
    text: "Python, Magic. SAM launch on Cyclops Two. Defending."

  # --- Rook Ops: Cyclops lost (cyclops_lost) -------------------------------------------------
  - id: ops_cyclops_lost_v1
    speaker: ops_lindqvist
    beat: cyclops_lost
    delivery: "Flat. A beat of silence before she speaks."
    text: "Python, Rook Ops. Cyclops Two has lost link. Assess it shot down."
  - id: ops_cyclops_lost_v2
    speaker: ops_lindqvist
    beat: cyclops_lost
    text: "Python, Rook Ops. Cyclops is gone. Stay on the radar."
  - id: ops_cyclops_lost_v3
    speaker: ops_lindqvist
    beat: cyclops_lost
    text: "Python, Rook Ops. No link from Cyclops Two. Copy it as lost. Continue."

  # --- Magic: Cyclops survived (cyclops_survived) --------------------------------------------
  - id: magic_cyclops_ok_v1
    speaker: awacs_magic
    beat: cyclops_survived
    text: "Python, Magic. Cyclops Two defended, back in the orbit."
  - id: magic_cyclops_ok_v2
    speaker: awacs_magic
    beat: cyclops_survived
    text: "Python, Magic. Cyclops is clear. Resuming."
  - id: magic_cyclops_ok_v3
    speaker: awacs_magic
    beat: cyclops_survived
    text: "Python, Magic. Cyclops Two reports the missile went stupid. Back on station."

  # --- Rook Ops: SA-6 radar destroyed (sa6_radar_destroyed) ----------------------------------
  # BENCHED (rendered audio kept in voice/; lint line_too_long/peak_chatter). Re-enable by
  # uncommenting and adding the id back to its beat.
  # - id: ops_radar_down_v1
  #  speaker: ops_lindqvist
  #  beat: sa6_radar_destroyed
  #  delivery: "Dry. The nearest she comes to pleased."
  #  text: "Python, Rook Ops. ELINT has the Straight Flush off the air. Copy your shot."
  - id: ops_radar_down_v2
    speaker: ops_lindqvist
    beat: sa6_radar_destroyed
    text: "Python, Rook Ops. The Straight Flush stopped mid-scan. I'll take that."
  - id: ops_radar_down_v3
    speaker: ops_lindqvist
    beat: sa6_radar_destroyed
    text: "Python, Rook Ops. SA-6 radar is down. Launchers are still out there."
  # BENCHED (rendered audio kept in voice/; lint line_too_long/peak_chatter). Re-enable by
  # uncommenting and adding the id back to its beat.
  # - id: ops_radar_down_v4
  #  speaker: ops_lindqvist
  #  beat: sa6_radar_destroyed
  #  text: "Python, Rook Ops. Copy. Six radar off the air. Get eyes on the site if you can."

  # --- Pike: SA-6 battery dead (sa6_battery_dead) --------------------------------------------
  - id: pike_battery_dead_v1
    speaker: wingman_pike
    beat: sa6_battery_dead
    text: "Python, Two. No movement at the SA-6 site. Vehicles burning."
  - id: pike_battery_dead_v2
    speaker: wingman_pike
    beat: sa6_battery_dead
    text: "Two. Pod shows the whole site burning."
  - id: pike_battery_dead_v3
    speaker: wingman_pike
    beat: sa6_battery_dead
    text: "Python, Two, good effect. Six site's done."

  # --- Rook Ops: SA-8 telegraph (sa8_warning) -----------------------------------------------
  - id: ops_sa8_warning_v1
    speaker: ops_lindqvist
    beat: sa8_warning
    delivery: "Quicker than before. Still not loud."
    text: "Python, Rook Ops. Ground reporting, short-range SAM moving near Al Bab. No location."
  - id: ops_sa8_warning_v2
    speaker: ops_lindqvist
    beat: sa8_warning
    text: "Python, Rook Ops. Possible SA-8 close to the town. Watch for launches."
  - id: ops_sa8_warning_v3
    speaker: ops_lindqvist
    beat: sa8_warning
    text: "Python, Rook Ops. A SAM vehicle just moved near Al Bab. Not on the list."
  - id: ops_sa8_warning_v4
    speaker: ops_lindqvist
    beat: sa8_warning
    text: "Python, Rook Ops. Possible pop-up SA-8 around Al Bab. Keep your speed up."

  # --- Pike: SA-8 spike (sa8_spike) --------------------------------------------------------
  - id: pike_sa8_spike_v1
    speaker: wingman_pike
    beat: sa8_spike
    delivery: "Fast, tight. Breathing heavier."
    text: "Python, Two, pop-up SAM near the town. Defending."
  - id: pike_sa8_spike_v2
    speaker: wingman_pike
    beat: sa8_spike
    text: "Two, SAM launch, close. Defending."
  - id: pike_sa8_spike_v3
    speaker: wingman_pike
    beat: sa8_spike
    text: "Python, Two, pop-up SAM, low. Chaff, flares. Defending."
  - id: pike_sa8_spike_v4
    speaker: wingman_pike
    beat: sa8_spike
    text: "Two, missile in the air off the town. Defending, defending."

  # --- Rook Ops: SA-8 destroyed (sa8_destroyed) ----------------------------------------------
  - id: ops_sa8_dead_v1
    speaker: ops_lindqvist
    beat: sa8_destroyed
    text: "Python, Rook Ops. Copy pop-up SAM destroyed. Logging it."
  - id: ops_sa8_dead_v2
    speaker: ops_lindqvist
    beat: sa8_destroyed
    text: "Python, Rook Ops. Copy. That SAM won't move again."
  - id: ops_sa8_dead_v3
    speaker: ops_lindqvist
    beat: sa8_destroyed
    text: "Python, Rook Ops. One short-range SAM off the list. Copy."

  # --- Rook Ops: window closed (window_closed) ----------------------------------------------
  - id: ops_window_closed_v1
    speaker: ops_lindqvist
    beat: window_closed
    delivery: "Procedural. The plan moving to its next line."
    text: "Python, Rook Ops. Window closed. Cleared to hunt emitters for five minutes, then RTB."
  - id: ops_window_closed_v2
    speaker: ops_lindqvist
    beat: window_closed
    text: "Python, Rook Ops. Time. Window's closed. Five minutes for anything that emitted."
  - id: ops_window_closed_v3
    speaker: ops_lindqvist
    beat: window_closed
    text: "Python, Rook Ops. Window closed. You're cleared DEAD on what you've found. Five minutes."
  - id: ops_window_closed_v4
    speaker: ops_lindqvist
    beat: window_closed
    text: "Python, Rook Ops. End of window. Hunt for five, then come home."

  # --- Rook Ops: window held (window_held_report) -------------------------------------------
  - id: ops_window_held_v1
    speaker: ops_lindqvist
    beat: window_held_report
    delivery: "Dry. Approval is in the words, not the tone."
    text: "Python, Rook Ops. Cyclops Two stayed on station the whole window. Copy. Nice work."
  - id: ops_window_held_v2
    speaker: ops_lindqvist
    beat: window_held_report
    text: "Python, Rook Ops. Cyclops has its pictures of Al Bab. Copy."
  - id: ops_window_held_v3
    speaker: ops_lindqvist
    beat: window_held_report
    text: "Python, Rook Ops. Cyclops Two reports a full orbit. Intel is happy. So am I."
  - id: ops_window_held_v4
    speaker: ops_lindqvist
    beat: window_held_report
    text: "Python, Rook Ops. Window held. Cyclops is staying on to look north-east."

  # --- Rook Ops: window failed (window_failed_report) ---------------------------------------
  - id: ops_window_failed_v1
    speaker: ops_lindqvist
    beat: window_failed_report
    delivery: "Level. No blame on the net."
    text: "Python, Rook Ops. No ISR over Al Bab today. Hunt what you can."
  - id: ops_window_failed_v2
    speaker: ops_lindqvist
    beat: window_failed_report
    text: "Python, Rook Ops. Window's a loss. Find the radar that did it."
  - id: ops_window_failed_v3
    speaker: ops_lindqvist
    beat: window_failed_report
    text: "Python, Rook Ops. We'll talk about Cyclops on the ground. Five minutes, then RTB."

  # --- Rook Ops: vul end / RTB (rtb_call) ---------------------------------------------------
  - id: ops_rtb_v1
    speaker: ops_lindqvist
    beat: rtb_call
    delivery: "Routine. The work is done either way."
    text: "Python, Rook Ops. Vul time. RTB, BDA on deck."
  - id: ops_rtb_v2
    speaker: ops_lindqvist
    beat: rtb_call
    text: "Python, Rook Ops. That's time. Come home. Shell is on the track if you need it."
  - id: ops_rtb_v3
    speaker: ops_lindqvist
    beat: rtb_call
    text: "Python, Rook Ops. Off station. RTB Incirlik. Bring both jets."
  - id: ops_rtb_v4
    speaker: ops_lindqvist
    beat: rtb_call
    text: "Python, Rook Ops. Vul end. RTB, say BDA on deck, not on this net."

  # --- Incirlik Tower: landing (tower_landing) ----------------------------------------------
  - id: tower_land_v1
    speaker: tower_incirlik
    beat: tower_landing
    delivery: "Flat, bored, fast."
    text: "Python One-One, Incirlik Tower, runway zero-five, cleared to land."
  - id: tower_land_v2
    speaker: tower_incirlik
    beat: tower_landing
    text: "Python One-One, Tower, wind calm, runway zero-five, cleared to land."
  - id: tower_land_v3
    speaker: tower_incirlik
    beat: tower_landing
    text: "Python One-One, Incirlik Tower, report initial, runway zero-five."
  - id: tower_land_v4
    speaker: tower_incirlik
    beat: tower_landing
    text: "Python One-One, Tower, no traffic. Cleared to land zero-five."

  # --- Rook Ops: on deck (on_deck) ---------------------------------------------------------
  - id: ops_on_deck_v1
    speaker: ops_lindqvist
    beat: on_deck
    delivery: "Off the clock now, still precise."
    text: "Python, Rook Ops. Copy on deck. Debrief in the vault."
  - id: ops_on_deck_v2
    speaker: ops_lindqvist
    beat: on_deck
    text: "Python, Rook Ops. Copy wheels down. Tapes to intel before you eat."
  - id: ops_on_deck_v3
    speaker: ops_lindqvist
    beat: on_deck
    text: "Python, Rook Ops. On deck, copy. Debrief in thirty."
  - id: ops_on_deck_v4
    speaker: ops_lindqvist
    beat: on_deck
    text: "Python, Rook Ops. Copy. Bring the HTS tapes to the vault."

  # --- Pike: AAA (aaa_firing) -----------------------------------------------------------------
  - id: pike_aaa_v1
    speaker: wingman_pike
    beat: aaa_firing
    text: "Python, Two, triple-A, north-west edge of town."
  - id: pike_aaa_v2
    speaker: wingman_pike
    beat: aaa_firing
    text: "Two, triple-A, low, off the town. Not a factor."
  - id: pike_aaa_v3
    speaker: wingman_pike
    beat: aaa_firing
    text: "Python, Two, guns up, Al Bab, well below us."
  - id: pike_aaa_v4
    speaker: wingman_pike
    beat: aaa_firing
    text: "Two, tracers, north-west side. Staying high."

  # --- Pike: MANPADS launch (manpads_launch) ------------------------------------------------
  - id: pike_manpads_v1
    speaker: wingman_pike
    beat: manpads_launch
    delivery: "Fast. Repetition, not volume."
    text: "Python, Two, missile launch, low, off the town. Flares."
  - id: pike_manpads_v2
    speaker: wingman_pike
    beat: manpads_launch
    text: "Two, smoke trail, coming up off the farms. Flares, flares."
  - id: pike_manpads_v3
    speaker: wingman_pike
    beat: manpads_launch
    text: "Python, Two, launch off the outskirts. Flares, flares."
  - id: pike_manpads_v4
    speaker: wingman_pike
    beat: manpads_launch
    text: "Two, MANPADS launch, short of us. Flares."

  # --- Rook Ops: say status (player_hit) ---------------------------------------------------
  - id: ops_say_status_v1
    speaker: ops_lindqvist
    beat: player_hit
    text: "Python, Rook Ops, say status."
  - id: ops_say_status_v2
    speaker: ops_lindqvist
    beat: player_hit
    text: "Python, Rook Ops. Say your status. Gaziantep is your nearest divert."
  - id: ops_say_status_v3
    speaker: ops_lindqvist
    beat: player_hit
    text: "Python, Rook Ops. Report damage when able. Head north if in doubt."

  # --- Rook Ops: civilian hit (civilian_hit) -----------------------------------------------
  - id: ops_check_fire_v1
    speaker: ops_lindqvist
    beat: civilian_hit
    delivery: "Check fire is the only thing she ever repeats."
    text: "Python, Rook Ops. Check fire, check fire. That was a civilian vehicle on the Al Bab road."
  - id: ops_check_fire_v2
    speaker: ops_lindqvist
    beat: civilian_hit
    text: "Check fire, check fire. Python, Rook Ops, civilian vehicle hit. Confirm PID on your next target."
  - id: ops_check_fire_v3
    speaker: ops_lindqvist
    beat: civilian_hit
    text: "Python, Rook Ops. Check fire. Civilian traffic hit near Al Bab. Stop and reassess."
  - id: ops_check_fire_v4
    speaker: ops_lindqvist
    beat: civilian_hit
    text: "Check fire. Python, Rook Ops. That was not a technical. We'll discuss it on deck."

  # --- Magic: ambient picture call (ambient_picture) ---------------------------------------
  - id: magic_picture_v1
    speaker: awacs_magic
    beat: ambient_picture
    text: "Python, Magic, picture clean."
  - id: magic_picture_v2
    speaker: awacs_magic
    beat: ambient_picture
    text: "Python, Magic. Clean. Shell is on the track, north."
  - id: magic_picture_v3
    speaker: awacs_magic
    beat: ambient_picture
    text: "Python, Magic. No change. Cyclops Two holding over Al Bab."
  - id: magic_picture_v4
    speaker: awacs_magic
    beat: ambient_picture
    text: "Magic, picture clean, no air."
