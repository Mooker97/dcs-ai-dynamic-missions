# Blue Air Force Unit Templates
# Reusable group compositions for friendly aircraft

# ============================================================================
# F-16C VIPER FLIGHTS
# ============================================================================

F16_SEAD_2ship:
  name: "Viper {id}"
  country: "USA"
  category: "plane"
  description: "2-ship F-16C SEAD element with HARMs and self-escort capability"
  units:
    - type: "F-16C_50"
      callsign: "Viper {id}-1"
      position: {offset: [0, 0]}
      loadout: "SEAD_Standard"
      fuel: 1.0
      skill: "Player"
    - type: "F-16C_50"
      callsign: "Viper {id}-2"
      position: {offset: [50, -50]}
      loadout: "SEAD_Standard"
      fuel: 1.0
      skill: "Good"
  waypoints:
    - action: "From Runway"
      position: {airbase: "auto"}
      alt: 0
      speed: 150
    - action: "Turning Point"
      position: {offset: [30000, 0]}
      alt: 7000
      speed: 250
    - action: "Turning Point"
      position: {offset: [80000, 20000]}
      alt: 8000
      speed: 260
  frequency: 251.0
  modulation: 0  # AM

