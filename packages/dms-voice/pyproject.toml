[project]
name = "dms-voice"
version = "0.3.0.dev0"
description = "DMS voice: ElevenLabs rendering, radio FX, cache"
requires-python = ">=3.11"
dependencies = ["dms-core", "elevenlabs>=1.0", "imageio-ffmpeg>=0.5", "python-dotenv>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dms_voice"]

[tool.uv.sources]
dms-core = { workspace = true }
