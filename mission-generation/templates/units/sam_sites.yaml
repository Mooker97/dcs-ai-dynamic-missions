  country: "Russia"
  description: "Basic layered air defense"
  threat_level: "High"
  groups:
    - template: "SA10_Grumble_Battalion"
      offset: [0, 0]
      role: "long_range"
    - template: "SA6_Gainful_Battery"
      offset: [-15000, 10000]
      role: "medium_range_1"
    - template: "SA6_Gainful_Battery"
      offset: [15000, 10000]
      role: "medium_range_2"
    - template: "SA15_Tor_Battery"
      offset: [0, 5000]
      role: "point_defense"
    - template: "ZSU23_Shilka_Section"
      offset: [0, 2000]
      role: "shorad"

Advanced_IADS:
  name: "IADS {id}"
  country: "Russia"
  description: "Advanced multi-layer IADS"
  threat_level: "Extreme"
  groups:
    - template: "SA20_Gargoyle_Battalion"
      offset: [0, 0]
      role: "long_range"
    - template: "SA10_Grumble_Battalion"
      offset: [-30000, 15000]
      role: "long_range_2"
    - template: "SA11_Gadfly_Battery"
      offset: [-15000, 10000]
      role: "medium_range_1"
    - template: "SA11_Gadfly_Battery"
      offset: [15000, 10000]
      role: "medium_range_2"
    - template: "SA15_Tor_Battery"
      offset: [0, 5000]
      role: "point_defense_1"
    - template: "SA19_Tunguska_Section"
      offset: [0, 8000]
      role: "point_defense_2"
    - template: "ZSU23_Shilka_Section"
      offset: [0, 3000]
      role: "shorad"

# ============================================================================
# MISSION TYPE RECOMMENDATIONS
# ============================================================================
#
# SEAD Missions:
#   Light: SA3 + SA6 + SA9/SA13
#   Moderate: SA6 + SA11 + SA15 + Shilka
#   Heavy: SA10 + SA6 x2 + SA15 + SA19
#   Overwhelming: Basic_IADS or Advanced_IADS
#
# Strike Missions (Target Defense):
#   Light: SA9/SA13 + ZSU-23
#   Moderate: SA15 + Shilka
#   Heavy: SA6 + SA15 + SA19
#
# CAP Missions (Airfield Defense):
#   Light: SA9 sections around airfield
#   Moderate: SA11 + SA15 at airfield
#   Heavy: SA10 + SA11 + SA15
#
# ============================================================================
# ENGAGEMENT TACTICS
# ============================================================================
#
# SAM Ambush Behavior:
#   - Set engagement_mode: "Hold Fire"
#   - Use lua-library/ai-behavior/sam-ambush.lua
#   - SAMs go HOT only when players are in range
#   - Prevents early HARM launches at emitting radars
#
# SHORAD Protection:
#   - Place SA-15/SA-19 near high-value SAMs
#   - Protects against HARMs and low-altitude penetration
#
# Range Layering:
#   - Long-range (SA-10/20): 50-75 NM umbrella
#   - Medium-range (SA-6/11): 20-30 NM coverage
#   - Short-range (SA-15/19): 8-12 NM point defense
#   - SHORAD (SA-9/13, AAA): <5 NM last-ditch
