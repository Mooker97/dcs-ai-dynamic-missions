[project]
name = "dms-core"
version = "0.3.0.dev0"
description = "DMS core: schemas, .miz read/write, catalog"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9", "pyyaml>=6", "lupa>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dms_core"]
