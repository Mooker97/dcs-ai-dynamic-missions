# DMS catalog: group templates
# -----------------------------------------------------------------------------
# GENERATED from legacy/lua-library/spawners/unit-templates.lua (dynamic-spawn groups,
# identical to the set embedded in the Dustoff Corridor master init) and
# legacy/mission-generation/templates/units/{blue_air,red_air,sam_sites}.yaml,
# plus a few new DMS templates (sa8, insurgent_cell, supply_convoy, ...).
#
# `templates.<id>` is a superset of the DMS_CONFIG `templates` entry (docs/CONTRACTS.md):
#   country     DCS country.id key (RUSSIA, USA, INSURGENTS, ...)            [DMS_CONFIG]
#   category    ground | plane | helicopter | ship                           [DMS_CONFIG]
#   skill       Average | Good | High | Excellent | Random                   [DMS_CONFIG]
#   units[]     {type, dx, dy, heading}  offsets in metres from the group anchor
#               (dx = north/x, dy = east/y, DCS map axes), heading in radians   [DMS_CONFIG]
#               optional per-unit `loadout` (named loadout, resolved by dms-gen)
# Catalog-only metadata (dropped when emitted into DMS_CONFIG):
#   name, description, role, tags, coalition (red|blue), eras (intersection of member unit
#   eras), threat, max_range_nm, alarm_state (red=weapons free / green=emcon), engage_range_m,
#   frequency (MHz) + modulation, tacan {channel, callsign}, callsign, static (spawn as static
#   object), source (where the template came from).
# Fixes vs legacy: SA-3 gained its "snr s-125 tr" track radar (it cannot engage without it);
#   invalid type strings corrected (see unit_types.yaml header); SA-20 template dropped
#   (S-300PMU not in DCS core) and removed from the advanced_iads package.
#
# `packages.<id>` combine templates: groups[] {template, dx, dy, role}.

