[project]
name = "dms-tacview"
version = "0.3.0.dev0"
description = "DMS Tacview: ACMI 2.x parser, flight summary and debrief facts"
requires-python = ">=3.11"
dependencies = ["dms-core", "pydantic>=2.9", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dms_tacview"]

[tool.uv.sources]
dms-core = { workspace = true }

[project.scripts]
dms-tacview = "dms_tacview.cli:main"
