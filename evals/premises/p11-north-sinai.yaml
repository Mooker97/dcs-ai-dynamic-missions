id: p11-north-sinai
title: North Sinai Nights
genre: adapted
prompt: 2015, northern Sinai. An Egyptian F-16 flight supports ground forces against insurgent networks
  around El Arish, with a liaison officer who doubts the intelligence they are given.
expect:
