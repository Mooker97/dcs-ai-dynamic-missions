# Generic DMS voice lines (mission-agnostic radio chatter).
#
# Sources: "supporting Files/Generic Voice Lines.md" and
# legacy/elevenlabs-integration/docs/VOICE-CATALOG.md (now data/voice/catalog.md).
# Shape: VoiceLineSet (docs/CONTRACTS.md, dms_core.schemas.voice). Each line has a stable
# snake_case id; `speaker` keys into `speakers` below, whose `voice` keys into
# data/voice/voices.json. `audio` points at an existing rendered take where one exists.
# Upper-case words in `text` mark emphasis from the original script.
# `beat` names the event a line suits (mission_start, good_kill, ...); missions map beats to
# lines in their own beats.yaml.
version: 1
speakers:
  generic_ground:
    voice: ground_troops
    role: Friendly ground troops under fire (excited, high energy)
  generic_jtac:
    voice: jtac
    role: JTAC / ground observer calling strike results and status
  generic_control:
    voice: mission_control
    role: Mission controller (mission start, complete, abort)
  generic_briefer:
    voice: briefing_officer
    role: Briefing officer opening the mission
  generic_wingman:
    voice: warning_system
    role: Fighter pilot / threat warning calls
lines:
  - id: support_request_01
    speaker: generic_ground
    text: "We need air support, NOW!"
    variants: []
    beat: support_request
    tags: [generic, ground_troops, requesting_support]
    notes: "Marked recorded in legacy catalog, but no rendered file exists in assets/audio."
